baseURL = 'https://blog.oskr.one'
title = "Oscar's Vault"
theme = 'papermod'
languageCode = 'en-us'
copyright = "© [MoXcz](https://github.com/moxcz)"

enableInlineShortcodes = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true
mainsections = ["notes"]

[minify]
disableXML = true

[pagination]
disableAliases = false
pagerSize = 5

[languages]

[languages.en]
languageName = "English"
weight = 1

[languages.en.taxonomies]
tag = "tags"

[[languages.en.menu.main]]
name = "Notes"
url = "notes"
weight = 4

[[languages.en.menu.main]]
name = "Archive"
url = "archives"
weight = 5

[[languages.en.menu.main]]
name = "Search"
url = "search/"
weight = 10

[[languages.en.menu.main]]
name = "Tags"
url = "tags/"
weight = 10

# [languages.es]
# languageName = ":es:"
