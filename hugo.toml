# languageAltTitle = "Spanish"

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
env = "production"
description = "public vault"
author = "Oscar"
defaultTheme = "auto"
ShowShareButtons = false
ShowReadingTime = true
displayFullLangName = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
ShowAllPagesInArchive = true
ShowPageNums = true
ShowToc = true
images = [""]

[params.homeInfoParams]
Title = 'Home'
Content = """
Welcome to my public knowledge base.

These notes come from my personal vault, feel free to use the search or tags to explore.
"""

[[params.socialIcons]]
name = "github"
title = "View Source on Github"
url = "https://github.com/moxcz/vault"

[params.editPost]
URL = "https://github.com/moxcz/moxcz/tree/main/site/content"
Text = "Suggest Changes"
appendFilePath = true

[params.assets]
disableHLJS = true

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false

[services.instagram]
disableInlineCSS = true

[services.x]
disableInlineCSS = true
