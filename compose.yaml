services:
  nginx:
    image: nginx:1.29
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blog-http.entrypoints=web"
      - "traefik.http.routers.blog-http.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.middlewares.blog-https.redirectscheme.scheme=https"
      - "traefik.http.routers.blog-http.middlewares=blog-https"
      - "traefik.http.routers.blog.entrypoints=web-secure"
      - "traefik.http.routers.blog.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.blog.tls=true"
      - "traefik.http.routers.blog.tls.certresolver=default"
      - "traefik.http.services.blog.loadbalancer.server.port=80"
    networks:
      - traefik_proxy

networks:
  traefik_proxy:
    external: true
